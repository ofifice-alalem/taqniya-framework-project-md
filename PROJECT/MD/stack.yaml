# ==============================================================================
# Project Technology Stack Specifications
# ==============================================================================
# وظيفته: تحديد التقنيات المستخدمة فعلياً في المشروع لضمان التزام الذكاء الاصطناعي بها
# دون افتراض مكتبات أو تقنيات خارجية خارجة عن النطاق.
# ملاحظة: يجب تحديد تقنية واحدة صريحة لكل بند عند تخصيص المشروع.
# ==============================================================================

project:
  name: "My Application"
  type: "Web Application"
  environment: "development"

frontend:
  framework: "React 18"
  language: "TypeScript"
  styling: "TailwindCSS"
  state_management: "Zustand"
  component_library: "Custom UI Components"

backend:
  framework: "Laravel 11"
  language: "PHP 8.3"
  architecture: "Repository Pattern"

database:
  main: "PostgreSQL 16"
  orm: "Eloquent"

cache:
  driver: "Redis"

api:
  type: "RESTful API"
  format: "JSON"

authentication:
  type: "Sanctum Token Authentication"
  library: "Laravel Sanctum"

testing:
  unit: "Pest PHP"
  e2e: "Playwright"

build_and_deployment:
  container: "Docker"
  ci_cd: "GitHub Actions"
  hosting: "VPS / Docker Engine"
