# ==============================================================================
# TAQNIYA STACK CONFIGURATION (stack.yaml)
# ==============================================================================
# هذا الملف يمثل الإعلان الرسمي لتقنيات وأدوات المشروع عبر 13 بُعداً معمارياً مستقلاً.
# يقرأ الذكاء الاصطناعي هذا الملف لتحديد الـ Technology Profiles بدقة دون افتراضات.
# ==============================================================================

project:
  name: "My Application"
  description: "Reference implementation for Taqniya AI Development Framework"
  type: "web"
  repository: "https://github.com/ofifice-alalem/taqniya-framework-project-md"

architecture:
  pattern: "Layered"
  communication:
    mode: "api_first" # direct | api_first | hybrid
    direct:
      enabled: false
      style: "None"
    api:
      enabled: true
      style: "rest"
      documentation: "OpenAPI 3.1 / Swagger"
    consumers:
      - "web"
      - "mobile"
      - "partner_api"

frontend:
  name: "React"
  version: "18.3"
  language: "TypeScript"
  package_manager: "npm"

styling:
  name: "Tailwind CSS"
  version: "3.4"

state:
  name: "Zustand"
  version: "4.5"

backend:
  name: "Laravel"
  version: "11.x"
  language: "PHP"
  package_manager: "Composer"

database:
  name: "PostgreSQL"
  version: "16.x"
  orm_or_query_builder: "Eloquent"
  migration_tool: "Framework Native"
  primary_key_strategy: "BigInt Auto-increment"

cache:
  name: "Redis"
  version: "7.x"

api:
  name: "REST"
  style: "RESTful"
  documentation: "OpenAPI 3.1 / Swagger"

authentication:
  name: "Sanctum"
  strategy: "API Tokens"
  rbac: "Custom Policies"

testing:
  name: "Pest"
  unit_runner: "Pest"
  integration_runner: "Pest"
  e2e_runner: "Playwright"
  mocking: "Mockery"

build:
  name: "Vite"
  bundler: "Vite"
  transpiler: "TypeScript (tsc)"

deployment:
  name: "Docker"
  platform: "Docker / VPS"
  container_runtime: "Docker"
  ci_cd: "GitHub Actions"

infrastructure:
  name: "Self-Hosted"
  provider: "Self-Hosted"
