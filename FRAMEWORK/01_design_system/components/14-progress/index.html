<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14. أشرطة التقدم والمراحل (Progress & Steppers) — Taqniya Design System</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&family=Syne:wght@700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Local Fast Offline Icons & Tailwind -->
    <script src="../../js/lucide.min.js"></script>
    <script src="../../js/tailwind.min.js"></script>
    <script src="../../js/tailwind.config.js"></script>
    <!-- Global Core Styles -->
    <link rel="stylesheet" href="../../css/taqniya.css">
</head>
<body class="min-h-screen bg-[var(--bx-canvas)] text-bx-text font-sans antialiased">

    <!-- Global Floating Toast Stack Container -->
    <div id="toastContainer" class="fixed top-4 left-4 z-[99999] flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

    <!-- Extra Top Overlays -->
    

    <div class="max-w-[1600px] mx-auto p-4 sm:p-8 lg:p-12 space-y-8">
        <!-- Component Header Navigation -->
        <header class="flex items-center justify-between border-b border-bx-border pb-4">
            <div class="flex items-center gap-3">
                <a href="../../index.html" class="bx-tag hover:border-bx-primary transition-all">← المعرض العام</a>
                <span class="text-bx-muted text-xs">/</span>
                <span class="text-xs font-black text-bx-title">14. أشرطة التقدم والمراحل (Progress & Steppers)</span>
            </div>
            <button type="button" onclick="toggleTheme()" class="bx-tag text-xs font-bold hover:border-bx-primary cursor-pointer flex items-center gap-2">
                <i data-lucide="moon" class="w-3.5 h-3.5"></i>
                <span>تبديل السمة (Light / Dark)</span>
            </button>
        </header>

        <!-- Main Section Content -->
        <main class="space-y-8">
            <section id="tasks" class="space-y-6">
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                        <span class="w-2.5 h-7 rounded-full bg-bx-primary"></span>
                        <h2 class="text-xl sm:text-2xl font-bold bx-title">14. مؤشرات الإنجاز والتقدم (Progress)</h2>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="bx-tag font-mono text-xs">Progress · Checklist</span>
                        <!-- Section Collapse Button -->
                        <button onclick="toggleSection('sec-tasks-body', 'sec-tasks-btn')" id="sec-tasks-btn"
                            class="w-8 h-8 rounded-full border border-bx-border hover:border-bx-primary flex items-center justify-center text-bx-muted hover:text-bx-primary transition-all cursor-pointer"
                            title="طي / توسيع القسم">
                            <i data-lucide="chevron-down" class="w-4 h-4 chevron-toggle"></i>
                        </button>
                    </div>
                </div>

                <!-- Collapsible Body for Section 14 -->
                <div id="sec-tasks-body" class="accordion-content space-y-6">
                    <div class="bx-card p-6 sm:p-8 space-y-6">
                        <!-- Progress & Checklist Section -->
                        <div class="space-y-5">
                            <div
                                class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-bx-divider">
                                <div class="flex items-center gap-3">
                                    <div
                                        class="w-10 h-10 rounded-2xl bg-bx-pill text-bx-primary border border-bx-border flex items-center justify-center font-black">
                                        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 class="bx-title text-base font-black">مؤشر الإنجاز والمهام (Progress)</h3>
                                        <p class="text-xs text-bx-muted">تتبع تقدم المهام المعمارية ومعدل الإنجاز اللحظي
                                        </p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span id="chkScore"
                                        class="bx-tag font-mono text-xs font-black text-bx-primary border-bx-primary/30">الإنجاز:
                                        75%</span>
                                    <span id="chkCount"
                                        class="bx-tag border-emerald-500/30 text-emerald-600 text-xs font-black">3 من 4
                                        مكتملة</span>
                                </div>
                            </div>

                            <!-- Dynamic Glowing Progress Bar -->
                            <div class="space-y-1.5">
                                <div class="flex justify-between items-center text-xs font-bold text-bx-muted">
                                    <span>نسبة التقدم الإجمالية في المشروع</span>
                                    <span class="font-mono text-bx-primary">75% Target SSoT</span>
                                </div>
                                <div
                                    class="w-full h-3 rounded-full overflow-hidden bg-[var(--bx-table-header)] border border-bx-border p-0.5 shadow-inner">
                                    <div id="chkBar"
                                        class="bg-gradient-to-r from-bx-primary to-emerald-500 h-full rounded-full transition-all duration-300 shadow-sm"
                                        style="width: 75%"></div>
                                </div>
                            </div>

                            <!-- Interactive Progress Checklist Items -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 pt-2">
                                <label
                                    class="flex items-center justify-between p-4 rounded-2xl border border-bx-border cursor-pointer hover:border-bx-primary bg-[var(--bx-surface-solid)] transition-all group">
                                    <span class="flex items-center gap-3 font-bold text-xs sm:text-sm">
                                        <input type="checkbox" checked onchange="updateChecklist()"
                                            class="chk-box bx-custom-check">
                                        <span>مراجعة وتوثيق القواعد المعمارية</span>
                                    </span>
                                    <span
                                        class="chk-status-tag text-xs font-bold text-emerald-500 flex items-center gap-1"><i
                                            data-lucide="check" class="w-3.5 h-3.5"></i> <span>تم</span></span>
                                </label>

                                <label
                                    class="flex items-center justify-between p-4 rounded-2xl border border-bx-border cursor-pointer hover:border-bx-primary bg-[var(--bx-surface-solid)] transition-all group">
                                    <span class="flex items-center gap-3 font-bold text-xs sm:text-sm">
                                        <input type="checkbox" checked onchange="updateChecklist()"
                                            class="chk-box bx-custom-check">
                                        <span>اجتياز اختبارات الأداء القياسية 100%</span>
                                    </span>
                                    <span
                                        class="chk-status-tag text-xs font-bold text-emerald-500 flex items-center gap-1"><i
                                            data-lucide="check" class="w-3.5 h-3.5"></i> <span>تم</span></span>
                                </label>

                                <label
                                    class="flex items-center justify-between p-4 rounded-2xl border border-bx-border cursor-pointer hover:border-bx-primary bg-[var(--bx-surface-solid)] transition-all group">
                                    <span class="flex items-center gap-3 font-bold text-xs sm:text-sm">
                                        <input type="checkbox" checked onchange="updateChecklist()"
                                            class="chk-box bx-custom-check">
                                        <span>تحديث وثائق المرحلة في شجرة SSoT</span>
                                    </span>
                                    <span
                                        class="chk-status-tag text-xs font-bold text-emerald-500 flex items-center gap-1"><i
                                            data-lucide="check" class="w-3.5 h-3.5"></i> <span>تم</span></span>
                                </label>

                                <label
                                    class="flex items-center justify-between p-4 rounded-2xl border border-bx-border cursor-pointer hover:border-bx-primary bg-[var(--bx-surface-solid)] transition-all group">
                                    <span class="flex items-center gap-3 font-bold text-xs sm:text-sm">
                                        <input type="checkbox" onchange="updateChecklist()"
                                            class="chk-box bx-custom-check">
                                        <span>اعتماد التسليم النهائي من المشرف المعماري</span>
                                    </span>
                                    <span
                                        class="chk-status-tag text-xs font-bold text-amber-500 flex items-center gap-1"><i
                                            data-lucide="clock" class="w-3.5 h-3.5"></i> <span>قيد
                                            الانتظار</span></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- ==================== 15. FEEDBACK & NOTIFICATIONS ==================== -->
        </main>
    </div>

    <!-- Extra Bottom Overlays (e.g. Modals) -->
    

    <!-- Global & Component JS -->
    <script src="../../js/taqniya.js"></script>
    <script src="component.js"></script>
    <script>
        function renderIcons() {
            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        }
        renderIcons();
        document.addEventListener('DOMContentLoaded', renderIcons);
        window.addEventListener('load', renderIcons);
    </script>
</body>
</html>
